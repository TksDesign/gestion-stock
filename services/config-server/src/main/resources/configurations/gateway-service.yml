server:
  port: 8222
spring:
  cloud:
    gateway:
      # Sans ces timeouts, un service en aval qui ne répond plus (bloqué, surchargé)
      # laissait la requête en attente indéfiniment côté frontend au lieu de déclencher
      # une vraie erreur 504 exploitable (voir GlobalErrorWebExceptionHandler).
      httpclient:
        connect-timeout: 5000
        response-timeout: 15s
      discovery:
        locator:
          enabled: true
      # CORS permissif pour le développement local d'un frontend web (autre origine,
      # ex. localhost:3000). Aucune authentification n'existe actuellement dans ce
      # backend (voir docs/API_DOCUMENTATION.md), donc allowCredentials reste à false ;
      # à revoir si une authentification par cookie/session est ajoutée un jour.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: customer-service
          uri: lb:http://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/customers/**
        - id: order-service
          uri: lb:http://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**
        - id: order-lines-service
          uri: lb:http://ORDER-SERVICE
          predicates:
            - Path=/api/v1/order-lines/**
        - id: product-service
          uri: lb:http://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**
        - id: payment-service
          uri: lb:http://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**
        - id: auth-service
          uri: lb:http://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: shop-service
          uri: lb:http://SHOP-SERVICE
          predicates:
            - Path=/api/v1/shops/**
