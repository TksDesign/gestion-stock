@if (totalPages() > 1) {
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4">
    <p class="text-xs font-semibold text-gray-500 dark:text-gray-400">
      {{ start() }}–{{ end() }} sur {{ _totalItems() }} {{ itemLabel }}
    </p>
    <div class="flex items-center gap-1">
      <button
        (click)="goTo(page - 1)"
        [disabled]="page === 1"
        class="w-9 h-9 flex items-center justify-center rounded-xl border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-white/5 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
        aria-label="Page précédente"
      >
        <lucide-angular [img]="icons.ChevronLeft" [size]="16"></lucide-angular>
      </button>
      @for (p of pages(); track $index) {
        @if (p === 'ellipsis') {
          <span class="w-9 h-9 flex items-center justify-center text-gray-400 text-sm">…</span>
        } @else {
          <button
            (click)="goTo(p)"
            class="w-9 h-9 flex items-center justify-center rounded-xl text-sm font-bold transition-colors"
            [class.bg-black]="p === page" [class.text-white]="p === page" [class.dark:bg-white]="p === page" [class.dark:text-black]="p === page"
            [class.text-gray-600]="p !== page" [class.dark:text-gray-300]="p !== page" [class.hover:bg-gray-50]="p !== page" [class.dark:hover:bg-white/5]="p !== page" [class.border]="p !== page" [class.border-transparent]="p !== page"
          >
            {{ p }}
          </button>
        }
      }
      <button
        (click)="goTo(page + 1)"
        [disabled]="page === totalPages()"
        class="w-9 h-9 flex items-center justify-center rounded-xl border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-white/5 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
        aria-label="Page suivante"
      >
        <lucide-angular [img]="icons.ChevronRight" [size]="16"></lucide-angular>
      </button>
    </div>
  </div>
}
