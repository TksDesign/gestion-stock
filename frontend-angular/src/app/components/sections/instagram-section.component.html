<section class="py-24 text-center bg-white dark:bg-gray-900 border-t border-b border-gray-100 dark:border-gray-800 overflow-hidden">
  <div class="mb-16 flex flex-col items-center animate-in fade-in zoom-in-95 duration-700">
    <div class="flex items-center justify-center gap-4 mb-4">
      <div class="w-12 md:w-24 h-[1px] bg-black dark:bg-white opacity-20"></div>
      <h2 class="text-4xl md:text-5xl font-serif font-black text-gray-900 dark:text-white tracking-tighter uppercase">Instagram</h2>
      <div class="w-12 md:w-24 h-[1px] bg-black dark:bg-white opacity-20"></div>
    </div>
    <p class="text-gray-500 dark:text-gray-400 text-sm tracking-[0.3em] uppercase font-bold">@KSHOP_Official</p>
  </div>

  <div class="flex w-full h-[300px] md:h-[450px]">
    @for (index of indices; track index) {
      <a
        href="#"
        (mouseenter)="hoveredIndex.set(index)"
        (mouseleave)="hoveredIndex.set(null)"
        class="relative overflow-hidden cursor-pointer block border-r border-white dark:border-gray-900 last:border-0 h-full transition-all duration-500"
        [style.flex]="hoveredIndex() === index ? 4 : hoveredIndex() !== null ? 0.8 : 1"
        [class.opacity-30]="hoveredIndex() !== null && hoveredIndex() !== index"
      >
        <img [src]="imageUrl(index)" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700" [class.scale-110]="hoveredIndex() === index" [class.scale-105]="hoveredIndex() !== index" alt="Instagram post" />

        <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] flex flex-col items-center justify-center gap-4 transition-opacity duration-400" [class.opacity-100]="hoveredIndex() === index" [class.opacity-0]="hoveredIndex() !== index">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span class="text-white text-xs font-bold tracking-[0.2em] whitespace-nowrap">SHOP THIS LOOK</span>
        </div>
      </a>
    }
  </div>
</section>
