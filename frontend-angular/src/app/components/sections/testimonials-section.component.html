<section class="bg-gray-50 dark:bg-gray-800/20 py-32 overflow-hidden border-t border-gray-100 dark:border-gray-800 relative">
  <div class="absolute top-10 left-1/2 -translate-x-1/2 text-[300px] text-gray-100 dark:text-gray-800/30 font-serif font-black opacity-40 pointer-events-none select-none z-0">"</div>

  <div class="container mx-auto px-4 text-center relative z-10">
    <div class="animate-in fade-in slide-in-from-bottom-4 duration-700">
      <h2 class="text-4xl md:text-5xl font-serif font-black text-gray-900 dark:text-white mb-4 tracking-tighter uppercase">What Customers Say</h2>
      <p class="text-gray-500 dark:text-gray-400 mb-20 text-sm tracking-[0.2em] uppercase font-semibold">Real reviews from our community</p>
    </div>

    <div class="relative w-full max-w-6xl mx-auto h-[350px] md:h-[250px] flex items-center justify-center [perspective:1000px]">
      @for (testimonial of testimonials; track testimonial.id; let i = $index) {
        <div
          class="absolute w-full max-w-md md:max-w-2xl bg-white dark:bg-gray-900 p-8 md:p-10 shadow-2xl rounded-sm flex flex-col md:flex-row gap-8 items-center text-left transition-all duration-700"
          [class.opacity-100]="position(i) === 'active'" [class.translate-x-0]="position(i) === 'active'" [class.scale-100]="position(i) === 'active'" [style.zIndex]="position(i) === 'active' ? 20 : position(i) === 'hidden' ? 0 : 10"
          [class.opacity-30]="position(i) === 'prev' || position(i) === 'next'" [class.scale-75]="position(i) === 'prev' || position(i) === 'next'"
          [class.-translate-x-[40%]]="position(i) === 'prev'"
          [class.translate-x-[40%]]="position(i) === 'next'"
          [class.opacity-0]="position(i) === 'hidden'" [class.scale-50]="position(i) === 'hidden'"
        >
          <div class="shrink-0 relative">
            <img [src]="testimonial.img" class="w-24 h-24 md:w-32 md:h-32 rounded-full object-cover shadow-lg" [alt]="testimonial.name" />
            <div class="absolute -bottom-2 -right-2 bg-black dark:bg-white text-white dark:text-black w-8 h-8 rounded-full flex items-center justify-center text-xs font-serif shadow-lg">"</div>
          </div>
          <div>
            <div class="flex text-yellow-400 mb-4 text-xs tracking-widest gap-1">
              @for (star of stars; track star) {
                <span>★</span>
              }
            </div>
            <p class="italic text-gray-600 dark:text-gray-300 mb-6 text-sm md:text-base leading-relaxed">"{{ testimonial.text }}"</p>
            <h4 class="font-bold text-gray-900 dark:text-white uppercase tracking-wider text-sm">{{ testimonial.name }}</h4>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">{{ testimonial.role }}</p>
          </div>
        </div>
      }
    </div>

    <div class="flex justify-center gap-6 mt-16 relative z-10">
      <button (click)="prevSlide()" class="w-14 h-14 flex items-center justify-center rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm hover:scale-110 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-all duration-300 text-gray-600 dark:text-gray-300 group">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="group-hover:-translate-x-1 transition-transform"><path d="M15 18l-6-6 6-6" /></svg>
      </button>
      <button (click)="nextSlide()" class="w-14 h-14 flex items-center justify-center rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm hover:scale-110 hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-all duration-300 text-gray-600 dark:text-gray-300 group">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="group-hover:translate-x-1 transition-transform"><path d="M9 18l6-6-6-6" /></svg>
      </button>
    </div>
  </div>
</section>
