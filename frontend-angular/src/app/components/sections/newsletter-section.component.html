<section class="container mx-auto px-4 py-32 overflow-hidden" (mouseenter)="isSectionHovered.set(true)" (mouseleave)="isSectionHovered.set(false)">
  <div class="flex flex-col md:flex-row items-center justify-between gap-12 max-w-6xl mx-auto">
    <div
      class="hidden lg:block w-56 relative z-10 transition-all duration-1000"
      [class.translate-x-0]="isSectionHovered()" [class.-rotate-12]="isSectionHovered()" [class.opacity-100]="isSectionHovered()" [class.scale-100]="isSectionHovered()"
      [class.translate-x-20]="!isSectionHovered()" [class.opacity-20]="!isSectionHovered()" [class.scale-80]="!isSectionHovered()"
    >
      <img
        src="https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&q=80&w=400"
        class="w-full drop-shadow-2xl rounded-sm filter grayscale hover:grayscale-0 transition-all duration-700"
        alt="Fashion Inspiration"
      />
    </div>

    <div class="text-center flex-1 relative z-20 transition-transform duration-700" [class.scale-[1.02]]="isSectionHovered()">
      <h2 class="text-4xl md:text-5xl lg:text-6xl font-serif font-black text-gray-900 dark:text-white mb-6 tracking-tighter uppercase transition-colors">Join The Club</h2>
      <p class="text-gray-500 dark:text-gray-400 mb-12 text-sm max-w-md mx-auto leading-relaxed">
        Subscribe to our newsletter and get <span class="font-bold text-gray-900 dark:text-white">20% off</span> your first purchase. Plus, get early access to new drops!
      </p>

      <form (submit)="handleSubmit($event)" class="relative max-w-lg mx-auto">
        <div
          class="flex shadow-2xl border transition-all overflow-hidden rounded-sm p-1.5 bg-white dark:bg-gray-900 focus-within:ring-2 focus-within:ring-black dark:focus-within:ring-white"
          [class.border-gray-300]="isSectionHovered()" [class.dark:border-gray-600]="isSectionHovered()" [class.shadow-black/10]="isSectionHovered()"
          [class.border-gray-100]="!isSectionHovered()" [class.dark:border-gray-800]="!isSectionHovered()"
        >
          <input type="email" required placeholder="your@email.com" class="flex-1 bg-transparent px-6 py-4 text-sm font-medium focus:outline-none text-gray-900 dark:text-white placeholder-gray-400" />
          @if (!isSubscribed()) {
            <button type="submit" class="bg-black dark:bg-white text-white dark:text-black px-8 py-4 uppercase text-xs font-bold tracking-widest hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors shadow-md animate-in fade-in slide-in-from-right-2 duration-300">
              Subscribe
            </button>
          } @else {
            <button type="button" class="bg-green-500 text-white px-10 py-4 uppercase text-xs font-bold tracking-widest flex items-center justify-center gap-2 shadow-md animate-in fade-in slide-in-from-bottom-2 duration-300">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
              Done
            </button>
          }
        </div>
      </form>
    </div>

    <div
      class="hidden lg:block w-56 relative z-10 transition-all duration-1000"
      [class.translate-x-0]="isSectionHovered()" [class.rotate-12]="isSectionHovered()" [class.opacity-100]="isSectionHovered()" [class.scale-100]="isSectionHovered()"
      [class.-translate-x-20]="!isSectionHovered()" [class.opacity-20]="!isSectionHovered()" [class.scale-80]="!isSectionHovered()"
    >
      <img
        src="https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?auto=format&fit=crop&q=80&w=400"
        class="w-full drop-shadow-2xl rounded-sm filter grayscale hover:grayscale-0 transition-all duration-700"
        alt="Fashion Style"
      />
    </div>
  </div>
</section>
