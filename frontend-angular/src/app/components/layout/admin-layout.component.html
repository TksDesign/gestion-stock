<ng-template #sidebarContent>
  <div class="p-6 border-b border-gray-800 flex justify-between items-center">
    <h2 class="text-xl font-serif font-bold">KSHOP Admin</h2>
    <button (click)="closeNav()" class="md:hidden p-2 text-gray-400 hover:text-white" aria-label="Close menu">
      <lucide-angular [img]="icons.X" [size]="20"></lucide-angular>
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto py-4">
    <ul class="space-y-1 px-3">
      @for (link of links; track link.to) {
        <li>
          <a
            [routerLink]="link.to"
            routerLinkActive="bg-blue-600 text-white"
            class="flex items-center px-4 py-3 rounded-xl transition-colors text-gray-400 hover:bg-gray-800 hover:text-white"
            (click)="closeNav()"
          >
            <span class="mr-3 text-lg">{{ link.icon }}</span>
            <span class="font-medium text-sm">{{ link.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="p-4 border-t border-gray-800">
    <div class="mb-4 px-4">
      <p class="text-sm font-medium">{{ user()?.firstname }} {{ user()?.lastname }}</p>
      <p class="text-xs text-gray-400 truncate">{{ user()?.email }}</p>
      <span class="inline-block mt-2 px-2 py-0.5 rounded text-[10px] font-bold bg-gray-800 text-gray-300">ADMIN</span>
    </div>

    <div class="flex space-x-2">
      <button (click)="toggleTheme()" class="flex-1 flex justify-center items-center py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors">
        {{ theme() === 'dark' ? '☀️' : '🌙' }}
      </button>
      <button (click)="logout()" class="flex-1 flex justify-center items-center py-2 rounded-lg bg-red-900/50 text-red-400 hover:bg-red-900/80 transition-colors">
        Déconnexion
      </button>
    </div>
  </div>
</ng-template>

<div class="flex h-screen bg-gray-50 dark:bg-gray-900 overflow-hidden font-sans">
  <aside class="hidden md:flex w-64 bg-gray-900 dark:bg-black text-white border-r border-gray-800 flex-col transition-colors duration-200">
    <ng-container [ngTemplateOutlet]="sidebarContent"></ng-container>
  </aside>

  @if (isMobileNavOpen()) {
    <div class="md:hidden fixed inset-0 z-50 flex">
      <div class="absolute inset-0 bg-black/50 backdrop-blur-sm animate-in fade-in duration-200" (click)="closeNav()"></div>
      <aside class="relative w-64 max-w-[85vw] h-full bg-gray-900 dark:bg-black text-white flex flex-col shadow-2xl animate-in slide-in-from-left duration-250">
        <ng-container [ngTemplateOutlet]="sidebarContent"></ng-container>
      </aside>
    </div>
  }

  <main class="flex-1 overflow-y-auto text-gray-900 dark:text-gray-100">
    <div class="md:hidden sticky top-0 z-20 flex items-center gap-3 px-4 py-4 bg-white/90 dark:bg-gray-900/90 backdrop-blur-xl border-b border-gray-200 dark:border-gray-800">
      <button (click)="openNav()" class="p-2 -ml-2 text-gray-600 dark:text-gray-300" aria-label="Open menu">
        <lucide-angular [img]="icons.Menu" [size]="22"></lucide-angular>
      </button>
      <h2 class="text-sm font-serif font-bold">KSHOP Admin</h2>
    </div>
    <div class="p-4 sm:p-6 md:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
